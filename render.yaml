services:
  - type: web
    name: ranko
    runtime: docker
    repo: https://github.com/derhami/ranko
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: SEOMATOR_HOME
        value: /data/seomator
    disk:
      name: ranko-data
      mountPath: /data
      sizeGB: 1