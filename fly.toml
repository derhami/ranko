# fly.toml for platform.sh/Fly.io deployment
# Docs: https://fly.io/docs/reference/configuration/

app = "ranko"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SEOMATOR_HOME = "/data/seomator"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "ranko_data"
  destination = "/data"